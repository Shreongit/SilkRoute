services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: silk_route
      POSTGRES_USER: silk_route_dev
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U silk_route_dev -d silk_route"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://silk_route_dev:local-development-only@postgres:5432/silk_route}
      SECRET_KEY: ${SECRET_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      FRONTEND_ORIGINS: http://localhost:5173
      LOCAL_MEDIA_DIR: /app/instance/private-media
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - backend_media:/app/instance/private-media
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "flask --app run:app db upgrade && flask --app run:app run --host=0.0.0.0"]
volumes:
  postgres_data:
  backend_media:
